<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC DOT Street Width ROW</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <div id="topbar">
      <h1>NYC DOT — Street Width ROW Viewer</h1>
      <span>5 Boroughs · 20 ft intervals · Mock Data</span>
    </div>

    <div id="body">
      <div id="sidebar">
        <div class="sidebar-label">Filters</div>
        <div id="filters">
          <input id="search" type="text" placeholder="Search street name…" autocomplete="off" />
          <select id="borough-filter">
            <option value="">All Boroughs</option>
            <option value="manhattan">Manhattan</option>
            <option value="brooklyn">Brooklyn</option>
            <option value="queens">Queens</option>
            <option value="bronx">Bronx</option>
            <option value="staten island">Staten Island</option>
          </select>
        </div>
        <div class="sidebar-label" style="margin-top:20px;">Segment Info</div>
        <div id="panel">
          <p id="placeholder">Click a street segment on the map to view its ROW breakdown.</p>
        </div>
      </div>
      <div id="map"></div>
    </div>

  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
